# Builds Inkwell for every platform.
#  - Push a tag like `v1.0.0` to build everything and publish a GitHub Release with the installers attached.
#  - Or bump "version" in package.json and push to main: the release is created automatically.
#  - Or run it by hand from the Actions tab ("Run workflow").
name: Build & Release

on:
  push:
    tags: ['v*']
    # Also build a release automatically when the version number (package.json) or this
    # workflow changes on main. The release and its `vX.Y.Z` tag are created by the
    # workflow itself. (Only main publishes, so builds never compete for Mac runners.)
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

# Sign-in and sharing settings (optional in the apps) come from .env.production.

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on Linux so it never waits for a Mac runner. Unsigned: the README's
          # one-line Terminal command signs it on the user's Mac.
          - { name: macOS, os: ubuntu-latest, script: dist:mac-zip, files: 'release/*-mac-*.zip' }
          - { name: Windows, os: windows-latest, script: dist:win, files: 'release/*.exe' }
          - { name: Linux, os: ubuntu-latest, script: dist:linux, files: "release/*.AppImage\nrelease/*.deb" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          # No paid code-signing certificate: build unsigned (see README for how to open it).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: inkwell-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # GitHub's Ubuntu runners ship with the Android SDK preinstalled (ANDROID_HOME is set).
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/Inkwell-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: inkwell-Android
          path: out/*.apk
          if-no-files-found: error

  # The .dmg and iOS builds need a GitHub Mac runner, which can be unavailable for a
  # long time (or out of free minutes). They run AFTER the release is published and add
  # their files to it when they finish, so they never hold up the other platforms.
  mac-dmg:
    name: macOS (.dmg, needs a Mac runner)
    needs: release
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: release/*.dmg

  ios:
    name: iOS (unsigned IPA, needs a Mac runner)
    needs: release
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build unsigned app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/App.app out/Payload/
          (cd out && zip -qry "Inkwell-${VERSION}-ios-unsigned.ipa" Payload && rm -rf Payload)
      - id: ver
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: out/*.ipa

  web:
    name: Web app (zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out && (cd dist && zip -qr "../out/Inkwell-${VERSION}-web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: inkwell-Web
          path: out/*.zip

  release:
    name: Publish GitHub Release
    # Publish even if one platform fails, so the others are still downloadable.
    if: always()
    needs: [desktop, android, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version tag
        id: ver
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
        continue-on-error: true
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Inkwell ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Download Inkwell
            | Platform | File |
            |---|---|
            | **Mac with Apple Silicon** (M1 or newer) | `Inkwell-*-mac-arm64.zip` |
            | **Mac with Intel** | `Inkwell-*-mac-x64.zip` |
            | Mac installer (when a Mac build machine was available) | `Inkwell-*-mac.dmg` |
            | **Windows** 10/11 | `Inkwell-*-windows-setup.exe` |
            | **Linux** | `.AppImage` or `.deb` |
            | **Android** | `Inkwell-*-android.apk` |
            | **iPhone / iPad** | Use the web app (Add to Home Screen), or sideload `Inkwell-*-ios-unsigned.ipa` |

            See the [README](../../#readme) for step-by-step install instructions.
